# The versions the release train publishes, all final versions and all
# always declared. Which of them a train actually releases is decided by
# the shape argument on the command line (bld, bld+rife2, bld+rife2+core
# or bld+core), members outside the shape are only converged onto the
# new bld. Extensions are checked out as siblings of the bld project
# directory, followers only ride the converge phase.
train.core.version=1.10.1
train.rife2.version=1.10.1
train.bld.version=3.0.1
train.extension.bld-antlr4=1.4.5
train.extension.bld-archive=0.6.5
train.extension.bld-tests-badge=1.6.5
train.followers=rife2-bld-hello
# Where the waits look for the release, empty is Maven Central. A URL is
# polled the same way, an absolute path is checked once since a copy
# either arrived or didn't. This is about resolvability: the bld build
# that follows RIFE2 generates projects that resolve from Central, and
# converge points wrappers at a bld that has to be downloadable. A
# rehearsal points this at its own repository.
train.releases.repository=
# Where the gate looks to see whether a publication already happened, so
# that a rerun after a failed push doesn't publish a second time. That
# only needs a repository every member publishes to, and the extensions
# never reach Central, so this names the RIFE2 one instead of being left
# empty. Falls back to train.releases.repository when it isn't set, so a
# rehearsal only has to redirect the line above.
train.published.repository=https://repo.rife2.com/releases
# A simulated train stays on this machine. Preflight then verifies that
# every publication destination and every push URL is a directory or a
# server on the loopback interface, so a missing override stops the train
# instead of releasing something publicly. See RELEASE-TRAIN.md.
train.simulate=false
# Whether the builds in the train also run their test suites, defaulting
# to running them. CI runs every suite on every push, so a release that
# follows a green run doesn't need them again. The generated project runs
# its tests either way.
train.tests=false
